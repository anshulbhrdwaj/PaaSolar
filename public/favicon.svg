<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Deep Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Solar Text Emerald Gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Solar Panel Grid Pattern -->
    <pattern id="solarGridPattern" width="24" height="48" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Container Box with Soft Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Background Solar Panel Grid -->
  <rect width="512" height="512" rx="112" fill="url(#solarGridPattern)" opacity="0.3"/>

  <!-- Golden Sunrise Horizon Glow -->
  <circle cx="256" cy="180" r="140" fill="#F59E0B" opacity="0.15" filter="blur(30px)"/>

  <!-- Main Content Stack -->
  <g text-anchor="middle" transform="translate(256, 220)">
    <!-- PAA SOLAR Text with Solar Grid Clip Simulation -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="url(#solarGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5" letter-spacing="-3" x="0" y="40">PAA</text>
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="url(#solarGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5" letter-spacing="-3" x="0" y="145">SOLAR</text>
    
    <!-- Gold Line Separator -->
    <line x1="-140" y1="180" x2="140" y2="180" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Blessing from this generation to next generation Tagline -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#F59E0B" letter-spacing="2" x="0" y="215">BLESSING FROM THIS GENERATION TO NEXT GENERATION</text>
  </g>

  <!-- Outer Border Outline -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.5"/>
</svg>
